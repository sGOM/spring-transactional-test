spring:
  datasource:
    # jdbc:h2:mem:testdb -> Creates an in-memory database named 'testdb'
    # DB_CLOSE_DELAY=-1 -> Keeps the database open when the last connection closes (until VM exits)
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
